# Tests and builds every push and pull request. Publishing a release (scripts/release.sh) updates the Homebrew cask
# in kleash/homebrew-tap to it, pushing with the deploy key in the TAP_DEPLOY_KEY secret.
name: Build
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    if: github.event_name != 'release'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ./test.sh
      - run: ./build.sh
  cask:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Update Casks/crate.rb
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=${TAG#v}
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "Crate-$version.zip"
          sha=$(sha256sum "Crate-$version.zip" | cut -d' ' -f1)
          install -m 600 /dev/null ~/tap-key && echo "$TAP_DEPLOY_KEY" > ~/tap-key
          export GIT_SSH_COMMAND="ssh -i ~/tap-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:kleash/homebrew-tap.git tap
          cd tap
          sed -i -e "s/^  version \".*\"/  version \"$version\"/" -e "s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/crate.rb
          git diff --exit-code --quiet && { echo "The cask is already at $version."; exit 0; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "crate $version"
          git push
